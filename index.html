<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المتاهة الأسطورية 2D - الـ 200 مرحلة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- القائمة الرئيسية -->
    <div id="mainMenu" class="overlay">
        <h1 class="game-title">المتاهة الأسطورية ⚔️</h1>
        <p class="author">تم التطوير بواسطة المبرمج: معاذ محمد عبد النبي</p>
        <p class="subtitle">ملحمة الـ 200 مرحلة - جرافيك مطور وسلاسة 60fps</p>
        <div class="menu-buttons">
            <button class="btn green" onclick="startGame()">ابدأ المغامرة 🚀</button>
            <button class="btn blue" onclick="openLevelSelect()">اختيار المرحلة (1 - 200) 🗺️</button>
        </div>
    </div>

    <!-- شاشة اختيار المراحل -->
    <div id="levelMenu" class="overlay hidden">
        <div class="modal-box large">
            <h2>اختيار المرحلة (1 - 200) 🗺️</h2>
            <div id="levelGrid" class="level-grid"></div>
            <button class="btn red" onclick="closeOverlay('levelMenu')">إغلاق</button>
        </div>
    </div>

    <!-- شاشة الفوز بالمرحلة -->
    <div id="winMenu" class="overlay hidden">
        <div class="modal-box">
            <h2 style="color: #2ecc71; margin-bottom: 15px;">تم اجتياز المرحلة بنجاح! 🎉</h2>
            <button class="btn green" onclick="nextLevel()">المرحلة التالية ⏩</button>
            <button class="btn red" onclick="showMainMenu()">القائمة الرئيسية 🏠</button>
        </div>
    </div>

    <!-- حاوية اللعبة بالعرض -->
    <div id="gameContainer">
        <canvas id="gameCanvas" width="960" height="480"></canvas>
    </div>

    <!-- أزرار التحكم اللمسية للموبايل -->
    <div id="controls">
        <div class="d-pad">
            <div class="ctrl-btn" id="btnLeft">◀</div>
            <div class="ctrl-btn" id="btnRight">▶</div>
        </div>
        <div class="action-pad">
            <div class="ctrl-btn jump" id="btnJump">▲</div>
            <div class="ctrl-btn fire" id="btnShoot">🔥</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
